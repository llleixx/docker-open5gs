logger:
  file:
    path: /var/log/open5gs/amf.log

global:

amf:
  sbi:
    server:
      - address: amf.open5gs.org
        port: 80
    client:
      nrf:
        - uri: http://nrf.open5gs.org:80
  ngap:
    server:
      - address: 10.250.81.2
  guami:
    - plmn_id:
        mcc: 460
        mnc: 88
      amf_id:
        region: 2
        set: 1
        pointer: 1
  tai:
    - plmn_id:
        mcc: 460
        mnc: 88
      tac: 81
  plmn_support:
    - plmn_id:
        mcc: 460
        mnc: 88
      s_nssai:
        - sst: 1
          sd: 000001
        - sst: 1
          sd: 000002
        - sst: 1
          sd: 000003
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA2, NEA1, NEA0]
  network_name:
    full: Open5GS
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090
